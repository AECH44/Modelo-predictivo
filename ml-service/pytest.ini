[pytest]
# Configuracion pytest para ml-service.
# Tests rapidos y sin red: no requieren PostgreSQL ni FastAPI corriendo.
#
# Uso:
#   1. Crear venv e instalar deps:
#      cd ml-service
#      python -m venv .venv
#      .venv/Scripts/python.exe -m pip install -r requirements.txt
#   2. Correr tests:
#      .venv/Scripts/python.exe -m pytest tests/ -v
#
# O con pytest global (sin venv) si se tienen las deps instaladas:
#   python -m pytest ml-service/tests/ -v

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    optional: marca tests que requieren dependencias opcionales (shap)
    slow: marca tests que tardan mas de 1 segundo